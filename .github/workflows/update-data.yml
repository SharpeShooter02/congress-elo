name: Refresh leaderboard data

# Rebuilds data.json / data.js from Stock Watcher + yfinance and commits them.
on:
  schedule:
    - cron: "0 11 * * 1-5"      # weekdays at 11:00 UTC
  workflow_dispatch:            # lets you trigger a run manually from the Actions tab

permissions:
  contents: write               # needed to commit the refreshed data back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Every run starts on a fresh runner, so without this the build refetches
      # all 446 filer files, the rosters, the exchange listings AND ~2,900 price
      # histories going back to 2012 -- to learn what changed since yesterday.
      # restore-keys lets a run start from the previous day's cache and top up.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: _cache
          key: elo-cache-${{ github.run_id }}
          restore-keys: |
            elo-cache-

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Build leaderboard data
        run: python build_leaderboard.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data.json data.js member
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh leaderboard data [skip ci]"
            git push
          fi
